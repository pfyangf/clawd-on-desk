<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>通知</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #card {
      margin: 8px;
      padding: 14px 16px;
      background: rgba(30, 32, 40, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #f2f3f5;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    #card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--accent, #409eff);
    }
    #row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    #topic {
      font-size: 11px;
      color: #9aa0ab;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #prio {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 8px;
      background: rgba(64, 158, 255, 0.18);
      color: #79bbff;
      flex-shrink: 0;
    }
    #title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #content {
      font-size: 12px;
      color: #c6c9d0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #hint { margin-top: 8px; font-size: 10px; color: #767c88; }
  </style>
</head>
<body>
  <div id="card">
    <div id="row">
      <span id="topic"></span>
      <span id="prio"></span>
    </div>
    <div id="title"></div>
    <div id="content"></div>
    <div id="hint">点击查看详情</div>
  </div>
  <script src="notify-bubble-renderer.js"></script>
</body>
</html>
